# Phase B — Deploy to development after successful CI on main
# Requires GitHub Environment "development" with secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# (Prefer OIDC later — see docs/adr/ADR-003-parameter-store.md)

name: Deploy — Development

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  PROJECT_NAME: s3files
  ENVIRONMENT: dev

jobs:
  quality-gate:
    name: Reuse CI checks
    uses: ./.github/workflows/ci.yml

  terraform-apply:
    name: Terraform apply (dev)
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  deploy-lambdas:
    name: Deploy Lambda packages (dev)
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Build backend
        working-directory: apps/backend
        run: |
          npm ci
          npm run build

      - name: Package and deploy functions
        working-directory: apps/backend
        run: |
          set -euo pipefail
          FUNCS=(files-api versions-api s3-event-processor analytics-api)
          STAGE=$(mktemp -d)
          cp -r dist/* "$STAGE/"
          cp -r node_modules "$STAGE/"
          (cd "$STAGE" && zip -qr /tmp/backend.zip .)
          for fn in "${FUNCS[@]}"; do
            aws lambda update-function-code \
              --function-name "${PROJECT_NAME}-${fn}-${ENVIRONMENT}" \
              --zip-file "fileb:///tmp/backend.zip" \
              --region "${AWS_REGION}"
            # Ensure handler matches compiled path after Terraform placeholder
            aws lambda update-function-configuration \
              --function-name "${PROJECT_NAME}-${fn}-${ENVIRONMENT}" \
              --handler "functions/${fn}/index.handler" \
              --region "${AWS_REGION}" >/dev/null
            echo "Deployed ${PROJECT_NAME}-${fn}-${ENVIRONMENT}"
          done
