# Production deploy with manual confirmation + GitHub Environment approval.
# Required secrets on environment "production":
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# Quality gates run on every push via "CI — Quality & Security"; this workflow
# does not re-call CI as a reusable workflow (permission conflicts).

name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  PROJECT_NAME: s3files
  ENVIRONMENT: prod

jobs:
  confirm:
    name: Confirm production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-prod" ]; then
            echo "Confirmation phrase mismatch — aborting."
            exit 1
          fi

  terraform-apply:
    name: Terraform apply (prod)
    needs: confirm
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  deploy-lambdas:
    name: Deploy Lambda packages (prod)
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Build backend
        working-directory: apps/backend
        run: |
          npm ci
          npm run build

      - name: Package and deploy functions
        working-directory: apps/backend
        run: |
          set -euo pipefail
          FUNCS=(files-api versions-api s3-event-processor analytics-api)
          STAGE=$(mktemp -d)
          cp -r dist/* "$STAGE/"
          cp -r node_modules "$STAGE/"
          (cd "$STAGE" && zip -qr /tmp/backend.zip .)
          for fn in "${FUNCS[@]}"; do
            aws lambda update-function-code \
              --function-name "${PROJECT_NAME}-${fn}-${ENVIRONMENT}" \
              --zip-file "fileb:///tmp/backend.zip" \
              --region "${AWS_REGION}"
            aws lambda wait function-updated \
              --function-name "${PROJECT_NAME}-${fn}-${ENVIRONMENT}" \
              --region "${AWS_REGION}"
            aws lambda update-function-configuration \
              --function-name "${PROJECT_NAME}-${fn}-${ENVIRONMENT}" \
              --handler "functions/${fn}/index.handler" \
              --region "${AWS_REGION}" >/dev/null
            aws lambda wait function-updated \
              --function-name "${PROJECT_NAME}-${fn}-${ENVIRONMENT}" \
              --region "${AWS_REGION}"
            echo "Deployed ${PROJECT_NAME}-${fn}-${ENVIRONMENT}"
          done
