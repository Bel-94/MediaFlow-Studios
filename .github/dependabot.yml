# Dependabot — keep dependencies and Actions secure and current
# Business value: outdated packages are detected automatically before they become CVEs.

version: 2
updates:
  # Frontend (Angular)
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(frontend)"

  # Backend (Lambda TypeScript)
  - package-ecosystem: npm
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(backend)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"

  # Terraform providers (lockfile / module sources where applicable)
  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - infrastructure
    commit-message:
      prefix: "chore(terraform)"

  - package-ecosystem: terraform
    directory: /infrastructure/environments/dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - infrastructure

  - package-ecosystem: terraform
    directory: /infrastructure/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - infrastructure
