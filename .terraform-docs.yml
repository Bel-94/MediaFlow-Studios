# terraform-docs — auto-generate module READMEs from .tf sources
# Run: terraform-docs markdown table --output-file README.md --output-mode inject <module-path>
# Or via pre-commit: pre-commit run terraform_docs --all-files

formatter: "markdown table"

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  required: true
  sensitive: true
  type: true
