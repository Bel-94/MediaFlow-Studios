# tfsec configuration — MediaFlow Studios DAM
# Docs: https://aquasecurity.github.io/tfsec/latest/guides/configuration/config/

version: 2

minimum_severity: MEDIUM

exclude:
  # Align with Checkov skips — see .checkov.yaml and ADR-003 / FinOps notes
  - aws-s3-encryption-customer-key
  - aws-cloudfront-enable-waf
  - aws-lambda-restrict-source-arn # handled at API Gateway authorizer layer
  - aws-sqs-queue-encryption-use-cmk

soft_fail: false
